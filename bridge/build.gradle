plugins {
    id 'java'
    id 'application'
}

group = 'io.jcrpc'
version = '0.3.2'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
    mavenLocal()
}

// Simulator coordinate the bridge JVM compiles and runs against. Override for
// a consumer pinned to another artefact, e.g. a fork that allows
// externalAccess=true engines:
//   ./gradlew build -PjcardsimDependency=works.relux:jcardsim:3.0.5.9-relux.1
// or set jcardsimDependency=... in gradle.properties / ~/.gradle/gradle.properties.
def defaultJcardsimDependency = 'com.klinec:jcardsim:3.0.5.9'
def jcardsimDependency = project.findProperty('jcardsimDependency') ?: defaultJcardsimDependency
if (!(jcardsimDependency ==~ /[A-Za-z0-9_.\-]+:[A-Za-z0-9_.\-]+:[A-Za-z0-9_.\-+]+/)) {
    throw new GradleException("invalid jcardsimDependency '${jcardsimDependency}': expected group:artifact:version (for example ${defaultJcardsimDependency})")
}

dependencies {
    implementation jcardsimDependency
    implementation files('libs/smartcardio.jar')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--add-modules', 'java.smartcardio'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

application {
    mainClass = 'io.jcrpc.bridge.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'io.jcrpc.bridge.Main'
    }
}

// Publish the actual archive and resolved dependencies for the counter launcher.
// Recreate on every build so changed configuration/artifacts cannot reuse a receipt.
tasks.register('publishLaunchClasspath') {
    dependsOn tasks.named('jar')
    doLast {
        def launchDir = layout.buildDirectory.dir('launch').get().asFile
        launchDir.mkdirs()
        def classpath = new File(launchDir, 'classpath.txt')
        def files = [tasks.named('jar').get().archiveFile.get().asFile] +
                configurations.runtimeClasspath.files.toList().sort { it.absolutePath }
        classpath.text = files.collect { it.absolutePath }.join('\n') + '\n'
        def inputs = [file('build.gradle'), file('settings.gradle'), classpath] +
                fileTree('src/main').files.toList().sort { it.absolutePath }
        if (file('gradle.properties').exists()) inputs.add(file('gradle.properties'))
        def checksum = { File input ->
            java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString()
        }
        new File(launchDir, 'checksums.sha256').text = (files + inputs).collect {
            "${checksum(it)}  ${it.absolutePath}"
        }.join('\n') + '\n# end of bridge build checksums\n'
    }
}

tasks.named('build') {
    dependsOn tasks.named('publishLaunchClasspath')
}

run {
    jvmArgs '--add-modules', 'java.smartcardio'
    standardInput = System.in
}
