plugins {
    id 'java'
    id 'application'
}

group = 'io.jcrpc'
version = '0.3.2'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
    mavenLocal()
}

// Simulator coordinate the bridge JVM compiles and runs against. Override for
// a consumer pinned to another artefact, e.g. a fork that allows
// externalAccess=true engines:
//   ./gradlew build -PjcardsimDependency=works.relux:jcardsim:3.0.5.9-relux.1
// or set jcardsimDependency=... in gradle.properties / ~/.gradle/gradle.properties.
def defaultJcardsimDependency = 'com.klinec:jcardsim:3.0.5.9'
def jcardsimDependency = project.findProperty('jcardsimDependency') ?: defaultJcardsimDependency
if (!(jcardsimDependency ==~ /[A-Za-z0-9_.\-]+:[A-Za-z0-9_.\-]+:[A-Za-z0-9_.\-+]+/)) {
    throw new GradleException("invalid jcardsimDependency '${jcardsimDependency}': expected group:artifact:version (for example ${defaultJcardsimDependency})")
}

dependencies {
    implementation jcardsimDependency
    implementation files('libs/smartcardio.jar')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--add-modules', 'java.smartcardio'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

application {
    mainClass = 'io.jcrpc.bridge.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'io.jcrpc.bridge.Main'
    }
}

run {
    jvmArgs '--add-modules', 'java.smartcardio'
    standardInput = System.in
}
